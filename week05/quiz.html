<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An online quiz with four questions about HTML and CSS.">
    <title>WDD 130 | HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <div class="question">
                <label for="q1">1. Fill in the blank: CSS stands for Cascading Style ______.</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="question">
                <label for="q2">2. In your own words, what is the difference between HTML and CSS?</label>
                <input id="q2" name="q2" rows="4" required></input>
            </div>

            <div class="question">
                <label for="q3">3. Which HTML element creates a hyperlink?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="link">&lt;link&gt;</option>
                    <option value="a">&lt;a&gt;</option>
                    <option value="href">&lt;href&gt;</option>
                </select>
            </div>

            <div class="question">
                <label for="q4">4. How many levels of HTML headings are there?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" step="1" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>&copy;2026 | HTML and CSS Quiz | Your Name</p>
    </footer>
</body>

</html>
